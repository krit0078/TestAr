<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR to AR Video</title>

  <!-- QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    #reader { width: 300px; margin: 20px auto; }
    #ar-scene { display: none; width: 100%; height: 100vh; }
    #title { text-align: center; color: white; margin-top: 1rem; }
    video { display: none; } /* video element ซ่อน */
  </style>
</head>
<body>
  <h2 id="title">🔍 Scan QR Code</h2>
  <div id="reader"></div>

  <!-- AR Scene -->
  <a-scene id="ar-scene" vr-mode-ui="false">
    <a-camera position="0 0 0"></a-camera>
    <a-entity id="ar-content" position="0 0 -2"></a-entity>
  </a-scene>

  <!-- video preload (จะเปลี่ยน src ภายหลัง) -->
  <video id="qrVideo" crossorigin="anonymous" playsinline></video>

  <script>
    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText) {
      console.log("QR Scanned:", decodedText);
      showAR(decodedText);
    }

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );

    function showAR(qrText) {
      document.getElementById("reader").style.display = "none";
      document.getElementById("title").innerText = "📱 AR Video";

      html5QrCode.stop().catch(err => console.error("Stop failed", err));

      const arScene = document.getElementById("ar-scene");
      arScene.style.display = "block";

      const arContent = document.getElementById("ar-content");
      const videoEl = document.getElementById("qrVideo");

      // กำหนดไฟล์วิดีโอจากโฟลเดอร์ video/
      const videoPath = `video/${qrText}.mp4`;

      // โหลดวิดีโอ
      videoEl.src = videoPath;
      videoEl.load();
      videoEl.play().catch(err => console.error("Autoplay failed:", err));
      videoEl.muted = true;
      videoEl.playsInline = true;
      // แสดงใน AR
      arContent.innerHTML = `
        <a-video 
          src="#qrVideo" 
          width="1.5" height="2.6" 
          autoplay="true">
        </a-video>`;
    }
  </script>
</body>
</html>
