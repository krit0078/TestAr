<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo Marker AR with QR Loop</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #qr-reader { position:absolute; top:10px; left:10px; width:250px; height:250px; z-index:10; border:2px solid white; background: rgba(0,0,0,0.5); }
    video { display:none; }
  </style>
</head>
<body>

<div id="qr-reader"></div>

<a-scene embedded vr-mode-ui="false">
  <a-camera position="0 0 0"></a-camera>
  <a-entity id="ar-content" position="0 0 -2"></a-entity>
</a-scene>

<video id="arVideo" playsinline muted loop></video>

<script>
const arContent = document.getElementById('ar-content');
const arVideo = document.getElementById('arVideo');
let html5QrCode;
let activeVideo = null;
let lastDetected = 0;
let currentQR = null;

// ฟังก์ชันแสดงวิดีโอ
function showVideo(decodedText){
  if (currentQR !== decodedText) {
    currentQR = decodedText;
    arVideo.src = `video/${decodedText}.mp4`;
    arVideo.load();
    arVideo.muted = true;
    arVideo.style.display = 'block';
    arVideo.play().catch(console.error);

    arContent.innerHTML = `<a-video src="#arVideo" width="1.5" height="2.6" autoplay="true"
      animation__fadein="property: components.material.material.opacity; from:0; to:1; dur:500; startEvents: fadein">
    </a-video>`;
    arContent.firstElementChild.emit('fadein');
    activeVideo = arVideo;
  }
}

// ฟังก์ชันซ่อนวิดีโอ
function hideVideo(){
  if(activeVideo){
    const vid = arContent.firstElementChild;
    if(vid){
      vid.setAttribute('animation__fadeout','property: components.material.material.opacity; from:1; to:0; dur:800; startEvents: fadeout');
      vid.emit('fadeout');
      setTimeout(()=>{
        arContent.innerHTML="";
        arVideo.pause();
        arVideo.style.display='none';
        activeVideo = null;
        currentQR = null;
      },800);
    }
  }
}

// เริ่มสแกน QR
html5QrCode = new Html5Qrcode("qr-reader");
html5QrCode.start(
  { facingMode:"environment" },
  { fps:10, qrbox:250 },
  decodedText => {
    lastDetected = Date.now();
    showVideo(decodedText);
  }
);

// ตรวจทุก 500ms ว่า marker หายหรือยัง
setInterval(()=>{
  if(activeVideo && Date.now() - lastDetected > 1000){
    // ถ้าเกิน 1 วิแล้วไม่ detect → ถือว่า marker lost
    hideVideo();
  }
},500);
</script>

</body>
</html>
