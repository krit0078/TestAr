<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR to AR Video</title>

  <!-- QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    #reader { width: 300px; margin: 20px auto; }
    #ar-scene { display: none; width: 100%; height: 100vh; }
    #title { text-align: center; color: white; margin-top: 1rem; }
  </style>
</head>
<body>
  <h2 id="title">🔍 Scan QR Code</h2>
  <div id="reader"></div>

  <!-- AR Scene -->
  <a-scene id="ar-scene" mindar-image="autoStart: true;" embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- AR Content -->
    <a-entity id="ar-content" position="0 0 -2"></a-entity>
  </a-scene>

  <script>
    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText) {
      console.log("QR Scanned:", decodedText);
      showAR(decodedText);
    }

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );

    function showAR(qrText) {
      document.getElementById("reader").style.display = "none";
      document.getElementById("title").innerText = "📱 AR Video";

      html5QrCode.stop().catch(err => console.error("Stop failed", err));

      const arScene = document.getElementById("ar-scene");
      arScene.style.display = "block";

      const arContent = document.getElementById("ar-content");

      // เงื่อนไข: ถ้า QR เป็น "video1" ให้แสดงวิดีโอ
      if (qrText === "b1.com") {
        arContent.innerHTML = `
          <a-video 
            src="video/v0.mp4" 
            width="1.6" 
            height="0.9" 
            autoplay="true" 
            loop="false"
            position="0 0 0">
          </a-video>`;
      } else {
        arContent.innerHTML = `<a-text value="หาวิดิโอไม่เจอ" align="center" color="red"></a-text>`;
      }
    }
  </script>
</body>
</html>
