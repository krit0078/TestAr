<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR to AR Video</title>

  <!-- QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    #reader { width: 300px; margin: 20px auto; }
    #ar-scene { display: none; width: 100%; height: 100vh; }
    #title { text-align: center; color: white; margin-top: 1rem; }
    video { display: none; } /* ซ่อน element video ป้องกันการซ้อนบนจอ */
  </style>
</head>
<body>
  <h2 id="title">🔍 Scan QR Code</h2>
  <div id="reader"></div>

  <!-- AR Scene -->
  <a-scene id="ar-scene" vr-mode-ui="false">
    <a-camera position="0 0 0"></a-camera>
    <a-entity id="ar-content" position="0 0 -2"></a-entity>
  </a-scene>

  <script>
    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText) {
      console.log("QR Scanned:", decodedText);
      showAR(decodedText);
    }

    // เริ่มสแกน
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );

    function showAR(qrText) {
      document.getElementById("reader").style.display = "none";
      document.getElementById("title").innerText = "📱 AR Video";

      html5QrCode.stop().catch(err => console.error("Stop failed", err));

      const arScene = document.getElementById("ar-scene");
      arScene.style.display = "block";

      const arContent = document.getElementById("ar-content");

      // สร้าง <video> element ใหม่
      const videoPath = `video/${qrText}.mp4`; // โหลดไฟล์จากโฟลเดอร์ video
      const videoEl = document.createElement("video");
      videoEl.setAttribute("id", "dynamicVideo");
      videoEl.setAttribute("src", videoPath);
      videoEl.setAttribute("playsinline", "true");
      videoEl.setAttribute("crossorigin", "anonymous");
      videoEl.style.display = "none";
      document.body.appendChild(videoEl);

      videoEl.play()
        .then(() => {
          arContent.innerHTML = `
            <a-video 
              src="#dynamicVideo" 
              width="1.6" height="0.9"
              autoplay="true">
            </a-video>`;
        })
        .catch(() => {
          arContent.innerHTML = `<a-text value="ไม่พบไฟล์วิดีโอ: ${qrText}" align="center" color="red"></a-text>`;
        });
    }
  </script>
</body>
</html>
